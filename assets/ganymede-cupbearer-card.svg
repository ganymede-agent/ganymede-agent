<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">rybskiworks / ganymede-agent</title>
  <desc id="desc">
    georgrybski machine identity. First moon that ships.
    Backdrop: Jupiter, trailing orbit arc, small moon west with transit shadow.
  </desc>

  <defs>
    <linearGradient id="whole-card-gradient" gradientUnits="userSpaceOnUse" x1="22" y1="22" x2="1178" y2="718">
      <stop offset="0%" class="grad-blue-edge"/>
      <stop offset="30%" class="grad-blue-edge"/>
      <stop offset="55%" class="grad-red-core"/>
      <stop offset="78%" class="grad-blue-edge"/>
      <stop offset="100%" class="grad-blue-edge"/>
    </linearGradient>
    <radialGradient id="planet-shade" cx="30%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2f3742" stop-opacity="0.50"/>
    </radialGradient>
    <filter id="band-wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.09" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" result="w"/>
      <feGaussianBlur in="w" stdDeviation="0.6"/>
    </filter>
    <filter id="blur8" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <linearGradient id="terminator" x1="1" y1="0.45" x2="0" y2="0.55">
      <stop offset="0%" stop-color="#10151c" stop-opacity="0.52"/>
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="trail-mask">
      <path d="M 739.5 215.0 L 821.8 174.6 L 818.7 175.2 L 815.6 175.8 L 812.6 176.4 L 809.6 177.0 L 806.7 177.7 L 803.8 178.3 L 801.0 179.0 L 798.2 179.6 L 795.5 180.2 L 792.8 180.9 L 790.2 181.5 L 787.6 182.2 L 785.1 182.9 L 782.7 183.5 L 780.2 184.2 L 777.9 184.9 L 775.6 185.5 L 773.4 186.2 L 771.2 186.9 L 769.1 187.6 L 767.0 188.3 L 765.0 188.9 L 763.1 189.6 L 761.2 190.3 L 759.4 191.0 L 757.7 191.7 L 756.0 192.4 L 754.4 193.1 L 752.8 193.7 L 751.3 194.4 L 749.9 195.1 L 748.5 195.8 L 747.2 196.5 L 746.0 197.2 L 744.9 197.8 L 743.8 198.5 L 742.7 199.2 L 741.8 199.9 L 740.9 200.6 L 740.1 201.2 L 739.3 201.9 L 738.6 202.6 L 738.0 203.2 L 737.4 203.9 L 737.0 204.5 L 736.6 205.2 L 736.2 205.9 L 735.9 206.5 L 735.7 207.1 L 735.6 207.8 L 735.6 208.4 L 735.6 209.0 L 735.6 209.7 L 735.8 210.3 L 736.0 210.9 L 736.3 211.5 L 736.7 212.1 L 737.1 212.7 L 737.6 213.3 L 738.1 213.9 L 738.8 214.5 L 739.5 215.0" fill="none" stroke="url(#trail-fade)" stroke-width="6" stroke-linecap="round"/>
    </mask>
    <clipPath id="jup-clip">
      <circle cx="965" cy="193" r="140"/>
    </clipPath>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .frame { fill: #f6f8fa; stroke: #c8d1db; stroke-width: 1.5; }
    .hairline { stroke: #c8d1db; stroke-width: 1.5; }
    .primary { fill: #1f2328; }
    .secondary { fill: #48515b; }
    .gradient-text { fill: url(#whole-card-gradient); }
    .grad-blue-edge { stop-color: #0891b2; }
    .grad-red-core { stop-color: #8250df; }
    .jup-base { fill: #f3e7d3; }
    .b1 { fill: #f7ecd4; }
    .b2 { fill: #eebd7f; }
    .b3 { fill: #f6e3c0; }
    .b4 { fill: #d9984f; }
    .b5 { fill: #f2d49e; }
    .b6 { fill: #c98544; }
    .b7 { fill: #ecca97; }
    .b8 { fill: #d99f58; }
    .spot { fill: #d95f3b; stroke: #a83e22; stroke-width: 2; }
    .spot-inner { fill: #f0936b; opacity: 0.85; }
    .orbit { fill: none; stroke: #c8d1db; stroke-width: 1.1; opacity: 0.55; }
    .orbit-ganymede { fill: none; stroke: #c8d1db; stroke-width: 1.4; opacity: 0.85; }
    .moon { fill: #9aa5b1; opacity: 0.9; }
    .moon-ganymede { fill: #0891b2; }
    .moon-halo { fill: none; stroke: #0891b2; stroke-width: 1.2; opacity: 0.7; }
    .star { fill: #c8d1db; opacity: 0.55; }
    .backdrop { opacity: 0.5; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .signature { font-size: 26px; font-weight: 700; letter-spacing: 1.2px; }
    .headline { font-size: 46px; font-weight: 700; letter-spacing: -1px; }
    .role { font-size: 24px; }
    .statement { font-size: 38px; font-weight: 600; letter-spacing: -0.45px; }
    .footer { font-size: 22px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .frame { fill: #161b22; stroke: #3a424c; }
      .hairline { stroke: #3a424c; }
      .primary { fill: #f0f6fc; }
      .secondary { fill: #a1abb5; }
      .grad-blue-edge { stop-color: #22d3ee; }
      .grad-red-core { stop-color: #d2a8ff; }
      .jup-base { fill: #2c2318; }
      .b1 { fill: #4a3823; }
      .b2 { fill: #33261a; }
      .b3 { fill: #54402a; }
      .b4 { fill: #6b4a26; }
      .b5 { fill: #453522; }
      .b6 { fill: #5e4023; }
      .b7 { fill: #3d2f1f; }
      .b8 { fill: #4f3a22; }
      .spot { fill: #8a5a4a; stroke: #a87a63; }
      .spot-inner { fill: #a87a63; opacity: 0.6; }
      .orbit { stroke: #3a424c; opacity: 0.7; }
      .orbit-ganymede { stroke: #3a424c; opacity: 0.95; }
      .moon { fill: #5b6570; }
      .moon-ganymede { fill: #22d3ee; }
      .moon-halo { stroke: #22d3ee; }
      .star { fill: #3a424c; opacity: 0.9; }
    }
  </style>

  <rect width="1200" height="740" rx="24" class="bg"/>
  <rect x="22" y="22" width="1156" height="696" rx="18" class="frame"/>

  <g class="backdrop">
    <circle cx="120" cy="120" r="2.5" class="star"/>
    <circle cx="210" cy="300" r="1.8" class="star"/>
    <circle cx="340" cy="120" r="2" class="star"/>
    <circle cx="520" cy="90" r="1.6" class="star"/>
    <circle cx="700" cy="130" r="2.2" class="star"/>
    <circle cx="880" cy="90" r="1.7" class="star"/>
    <circle cx="150" cy="620" r="2" class="star"/>
    <circle cx="320" cy="680" r="1.6" class="star"/>
    <!-- trailing arc: moon moves west, trail fades behind (far side) -->
    <ellipse cx="965" cy="193" rx="230" ry="36" transform="rotate(-4 965 193)" fill="none" stroke="none"/>
    <g mask="url(#trail-mask)">
      <ellipse cx="965" cy="193" rx="230" ry="36" transform="rotate(-4 965 193)" class="orbit-ganymede"/>
    </g>
    <!-- Jupiter: banded body -->
    <circle cx="965" cy="193" r="140" class="jup-base" stroke="#6b7683" stroke-width="2"/>
    <g clip-path="url(#jup-clip)">
      <g filter="url(#band-wobble)">
      <rect x="825" y="53" width="280" height="42" class="b1"/>
      <rect x="825" y="95" width="280" height="36" class="b2"/>
      <rect x="825" y="131" width="280" height="34" class="b3"/>
      <rect x="825" y="165" width="280" height="30" class="b4"/>
      <rect x="825" y="195" width="280" height="32" class="b5"/>
      <rect x="825" y="227" width="280" height="34" class="b6"/>
      <rect x="825" y="261" width="280" height="36" class="b7"/>
      <rect x="825" y="297" width="280" height="36" class="b8"/>
      <!-- belt ripple -->
      <path d="M 825 165 Q 895 158 965 165 T 1105 163" fill="none" stroke="#c8d1db" stroke-width="1" opacity="0.5"/>
      <path d="M 825 227 Q 895 234 965 227 T 1105 229" fill="none" stroke="#c8d1db" stroke-width="1" opacity="0.5"/>
      </g>
      <!-- Great Red Spot -->
      <ellipse cx="1012" cy="246" rx="30" ry="17" class="spot"/>
      <ellipse cx="1012" cy="246" rx="17" ry="9" class="spot-inner"/>
      <!-- ganymede transit shadow -->
      <ellipse cx="890" cy="196" rx="8" ry="8" fill="#10151c" opacity="0.45" filter="url(#blur2)"/>
      <!-- east-lower shade: kills the bright SE curvature -->
      <!-- limb shading -->
      <circle cx="965" cy="193" r="140" fill="url(#planet-shade)"/>
      <circle cx="965" cy="193" r="140" fill="url(#terminator)"/>
      <!-- underside crescent: diagonal lower-cap shade -->
      <ellipse cx="965" cy="322" rx="185" ry="100" transform="rotate(-14 965 322)" fill="#10151c" opacity="0.32" filter="url(#blur8)"/>
    </g>
    <circle cx="965" cy="193" r="140" fill="none" stroke="#4b5560" stroke-width="2"/>
    <!-- ganymede: small, highlighted, west elongation -->
    <circle cx="739.5" cy="215.0" r="8" class="moon-halo"/>
    <circle cx="739.5" cy="215.0" r="4.5" class="moon-ganymede"/>
  </g>

  <text x="60" y="86" class="signature gradient-text">rybskiworks</text>

  <text x="60" y="147" class="headline primary">ganymede-agent</text>
  <text x="60" y="207" class="role secondary">georgrybski&#8217;s machine identity</text>

  <text x="60" y="460" class="statement primary">first moon that ships.</text>

  <line x1="60" y1="637" x2="1140" y2="637" class="hairline"/>

  <text x="60" y="686" class="footer secondary">code of mass construction</text>
</svg>
