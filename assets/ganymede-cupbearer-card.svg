<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">rybskiworks / ganymede-agent</title>
  <desc id="desc">
    georgrybski machine identity. First moon that ships.
    Backdrop: Jupiter, trailing orbit arc, small moon west with transit shadow.
  </desc>

  <defs>
    <linearGradient id="whole-card-gradient" gradientUnits="userSpaceOnUse" x1="22" y1="22" x2="1178" y2="718">
      <stop offset="0%" class="grad-blue-edge"/>
      <stop offset="30%" class="grad-blue-edge"/>
      <stop offset="55%" class="grad-red-core"/>
      <stop offset="78%" class="grad-blue-edge"/>
      <stop offset="100%" class="grad-blue-edge"/>
    </linearGradient>
    <radialGradient id="planet-shade" cx="30%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3b2312" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="band-wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.09" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" result="w"/>
      <feGaussianBlur in="w" stdDeviation="0.6"/>
    </filter>
    <filter id="blur8" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="blur1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <linearGradient id="terminator" x1="0.2" y1="0.1" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="52%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="limb-grade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="tac-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.0" class="tac-dot"/>
      <circle cx="18" cy="18" r="1.4" class="tac-dot-faint"/>
    </pattern>
    <clipPath id="inner-clip">
      <rect x="22" y="22" width="1156" height="696" rx="18"/>
    </clipPath>
    <linearGradient id="trail-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="trail-mask">
      <path d="M 816.1 190.9 L 811.3 191.6 L 806.6 192.2 L 801.9 192.9 L 797.2 193.6 L 792.6 194.3 L 788.1 194.9 L 783.6 195.6 L 779.2 196.3 L 774.8 196.9 L 770.5 197.6 L 766.2 198.3 L 762.0 198.9 L 757.9 199.6 L 753.8 200.3 L 749.8 200.9 L 745.9 201.6 L 742.0 202.2 L 738.2 202.9 L 734.5 203.5 L 730.8 204.2 L 727.2 204.8 L 723.7 205.4 L 720.2 206.1 L 716.8 206.7 L 713.5 207.3 L 710.3 207.9 L 707.2 208.6 L 704.1 209.2 L 701.1 209.8 L 698.2 210.4 L 695.4 211.0 L 692.7 211.6 L 690.0 212.2 L 687.4 212.7 L 684.9 213.3 L 682.5 213.9 L 680.2 214.4 L 678.0 215.0 L 675.8 215.5 L 673.8 216.1 L 671.8 216.6 L 669.9 217.1 L 668.1 217.7 L 666.4 218.2 L 664.8 218.7 L 663.3 219.2 L 661.9 219.7 L 660.5 220.1 L 659.3 220.6 L 658.1 221.1 L 657.1 221.5 L 656.1 222.0 L 655.3 222.4 L 654.5 222.8 L 653.8 223.3 L 653.2 223.7 L 652.7 224.1 L 652.3 224.5 L 652.0 224.8 L 651.8 225.2 L 651.7 225.6 L 651.7 225.9 L 651.8 226.3 L 652.0 226.6 L 652.3 226.9 L 652.6 227.2 L 653.1 227.5 L 653.7 227.8 L 654.3 228.1 L 655.1 228.4 L 655.9 228.6 L 656.8 228.9 L 657.9 229.1 L 659.0 229.3 L 660.2 229.6 L 661.5 229.8 L 662.9 230.0" fill="none" stroke="url(#trail-fade)" stroke-width="6" stroke-linecap="round"/>
    </mask>
    <clipPath id="jup-clip">
      <circle cx="965" cy="193" r="140"/>
    </clipPath>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .frame { fill: #f6f8fa; stroke: #c8d1db; stroke-width: 1.5; }
    .hairline { stroke: #c8d1db; stroke-width: 1.5; }
    .primary { fill: #1f2328; }
    .secondary { fill: #48515b; }
    .gradient-text { fill: url(#whole-card-gradient); }
    .grad-blue-edge { stop-color: #0891b2; }
    .grad-red-core { stop-color: #8250df; }
    .jup-base { fill: #d8cfc2; }
    .cap-top { fill: #8f8878; }
    .b2a { fill: #b5a691; }
    .b2b { fill: #c9a37e; }
    .b2c { fill: #b5a691; }
    .b3 { fill: #ccb59b; }
