<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">rybskiworks / ganymede-agent</title>
  <desc id="desc">
    rybskiworks machine. Code of mass construction.
    Intake, scope, run, prove. Delegation-first, validation outside.
    Backdrop: Jupiter with its four large moons; one orbit highlighted.
  </desc>

  <defs>
    <linearGradient id="whole-card-gradient" gradientUnits="userSpaceOnUse" x1="22" y1="22" x2="1178" y2="718">
      <stop offset="0%" class="grad-blue-edge"/>
      <stop offset="30%" class="grad-blue-edge"/>
      <stop offset="55%" class="grad-red-core"/>
      <stop offset="78%" class="grad-blue-edge"/>
      <stop offset="100%" class="grad-blue-edge"/>
    </linearGradient>
    <radialGradient id="planet-shade" cx="38%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5b6570" stop-opacity="0.35"/>
    </radialGradient>
    <clipPath id="jup-clip">
      <circle cx="985" cy="185" r="140"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" class="arrow"/>
    </marker>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .frame, .node { fill: #f6f8fa; stroke: #c8d1db; stroke-width: 1.5; }
    .hairline { stroke: #c8d1db; stroke-width: 1.5; }
    .flow { stroke: #b1bac4; stroke-width: 1.5; }
    .arrow { fill: #b1bac4; }
    .primary { fill: #1f2328; }
    .secondary { fill: #48515b; }
    .gradient-text { fill: url(#whole-card-gradient); }
    .selected-node { fill: #f6f8fa; stroke: url(#whole-card-gradient); stroke-width: 2.5; }
    .selected-sub { fill: url(#whole-card-gradient); }
    .grad-blue-edge { stop-color: #0891b2; }
    .grad-red-core { stop-color: #8250df; }
    .jup-base { fill: #f3e7d3; }
    .b1 { fill: #f8f3e8; }
    .b2 { fill: #e9d3ae; }
    .b3 { fill: #f8f1e3; }
    .b4 { fill: #dfb98f; }
    .b5 { fill: #f5e9d6; }
    .b6 { fill: #d9ac7e; }
    .b7 { fill: #efe0c6; }
    .b8 { fill: #e5c9a0; }
    .spot { fill: #e07a5f; stroke: #b8543f; stroke-width: 2; }
    .spot-inner { fill: #f0a080; opacity: 0.8; }
    .orbit { fill: none; stroke: #c8d1db; stroke-width: 1.1; opacity: 0.55; }
    .orbit-ganymede { fill: none; stroke: #c8d1db; stroke-width: 1.4; opacity: 0.85; }
    .moon { fill: #9aa5b1; opacity: 0.9; }
    .moon-ganymede { fill: url(#whole-card-gradient); }
    .moon-halo { fill: none; stroke: url(#whole-card-gradient); stroke-width: 1.2; opacity: 0.6; }
    .star { fill: #c8d1db; opacity: 0.55; }
    .backdrop { opacity: 0.5; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .signature { font-size: 26px; font-weight: 700; letter-spacing: 1.2px; }
    .headline { font-size: 46px; font-weight: 700; letter-spacing: -1px; }
    .role { font-size: 24px; }
    .statement { font-size: 38px; font-weight: 600; letter-spacing: -0.45px; }
    .node-title { font-size: 30px; font-weight: 700; letter-spacing: 0.5px; }
    .node-sub { font-size: 23px; }
    .node-sub-strong { font-size: 23px; font-weight: 700; }
    .footer { font-size: 22px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .frame, .node { fill: #161b22; stroke: #3a424c; }
      .selected-node { fill: #161b22; }
      .hairline { stroke: #3a424c; }
      .flow { stroke: #5b6570; }
      .arrow { fill: #5b6570; }
      .primary { fill: #f0f6fc; }
      .secondary { fill: #a1abb5; }
      .grad-blue-edge { stop-color: #22d3ee; }
      .grad-red-core { stop-color: #d2a8ff; }
      .jup-base { fill: #232b3a; }
      .b1 { fill: #2a3345; }
      .b2 { fill: #1f2735; }
      .b3 { fill: #2e3a4f; }
      .b4 { fill: #3a3a4a; }
      .b5 { fill: #28303f; }
      .b6 { fill: #33394a; }
      .b7 { fill: #262d3b; }
      .b8 { fill: #2b3343; }
      .spot { fill: #8a5a4a; stroke: #a87a63; }
      .spot-inner { fill: #a87a63; opacity: 0.6; }
      .orbit { stroke: #3a424c; opacity: 0.7; }
      .orbit-ganymede { stroke: #3a424c; opacity: 0.95; }
      .moon { fill: #5b6570; }
      .star { fill: #3a424c; opacity: 0.9; }
    }
  </style>

  <rect width="1200" height="740" rx="24" class="bg"/>
  <rect x="22" y="22" width="1156" height="696" rx="18" class="frame"/>

  <g class="backdrop">
    <circle cx="120" cy="120" r="2.5" class="star"/>
    <circle cx="210" cy="300" r="1.8" class="star"/>
    <circle cx="340" cy="120" r="2" class="star"/>
    <circle cx="520" cy="90" r="1.6" class="star"/>
    <circle cx="700" cy="130" r="2.2" class="star"/>
    <circle cx="880" cy="90" r="1.7" class="star"/>
    <circle cx="150" cy="620" r="2" class="star"/>
    <circle cx="320" cy="680" r="1.6" class="star"/>
    <!-- moon orbits (behind the planet) -->
    <ellipse cx="985" cy="185" rx="145" ry="38" transform="rotate(-4 985 185)" class="orbit"/>
    <ellipse cx="985" cy="185" rx="160" ry="46" transform="rotate(-4 985 185)" class="orbit"/>
    <ellipse cx="985" cy="185" rx="178" ry="55" transform="rotate(-4 985 185)" class="orbit-ganymede"/>
    <ellipse cx="985" cy="185" rx="195" ry="68" transform="rotate(-4 985 185)" class="orbit"/>
    <!-- Jupiter: banded body -->
    <circle cx="985" cy="185" r="140" class="jup-base" stroke="#c8d1db" stroke-width="1.5"/>
    <g clip-path="url(#jup-clip)">
      <rect x="845" y="45" width="280" height="42" class="b1"/>
      <rect x="845" y="87" width="280" height="36" class="b2"/>
      <rect x="845" y="123" width="280" height="34" class="b3"/>
      <rect x="845" y="157" width="280" height="30" class="b4"/>
      <rect x="845" y="187" width="280" height="32" class="b5"/>
      <rect x="845" y="219" width="280" height="34" class="b6"/>
      <rect x="845" y="253" width="280" height="36" class="b7"/>
      <rect x="845" y="289" width="280" height="36" class="b8"/>
      <!-- belt ripple -->
      <path d="M 845 157 Q 915 150 985 157 T 1125 155" fill="none" stroke="#c8d1db" stroke-width="1" opacity="0.5"/>
      <path d="M 845 219 Q 915 226 985 219 T 1125 221" fill="none" stroke="#c8d1db" stroke-width="1" opacity="0.5"/>
      <!-- Great Red Spot -->
      <ellipse cx="1032" cy="238" rx="30" ry="17" class="spot"/>
      <ellipse cx="1032" cy="238" rx="17" ry="9" class="spot-inner"/>
      <!-- limb shading -->
      <circle cx="985" cy="185" r="140" fill="url(#planet-shade)"/>
    </g>
    <circle cx="985" cy="185" r="140" fill="none" stroke="#c8d1db" stroke-width="1.5"/>
    <!-- moons: io, europa, callisto, ganymede highlighted -->
    <circle cx="1117.2" cy="191.9" r="4" class="moon"/>
    <circle cx="830.0" cy="183.9" r="4" class="moon"/>
    <circle cx="839.0" cy="239.0" r="4.5" class="moon"/>
    <circle cx="1144.3" cy="150.6" r="11" class="moon-halo"/>
    <circle cx="1144.3" cy="150.6" r="7" class="moon-ganymede"/>
  </g>

  <text x="60" y="86" class="signature gradient-text">rybskiworks</text>

  <text x="60" y="147" class="headline primary">ganymede-agent</text>
  <text x="60" y="207" class="role secondary">task in / proof out</text>

  <line x1="60" y1="247" x2="1140" y2="247" class="hairline"/>

  <text x="60" y="331" class="statement primary">code of mass</text>
  <text x="60" y="384" class="statement primary">construction.</text>

  <rect x="60" y="470" width="222" height="118" rx="12" class="node"/>
  <text x="84" y="515" class="node-title primary">intake</text>
  <text x="84" y="555" class="node-sub secondary">task</text>

  <line x1="282" y1="529" x2="334" y2="529" class="flow" marker-end="url(#arrow)"/>

  <rect x="346" y="470" width="222" height="118" rx="12" class="node"/>
  <text x="370" y="515" class="node-title primary">scope</text>
  <text x="370" y="555" class="node-sub secondary">authority</text>

  <line x1="568" y1="529" x2="620" y2="529" class="flow" marker-end="url(#arrow)"/>

  <rect x="632" y="470" width="222" height="118" rx="12" class="node"/>
  <text x="656" y="515" class="node-title primary">run</text>
  <text x="656" y="555" class="node-sub secondary">work</text>

  <line x1="854" y1="529" x2="906" y2="529" class="flow" marker-end="url(#arrow)"/>

  <rect x="918" y="470" width="222" height="118" rx="12" class="selected-node"/>
  <text x="942" y="515" class="node-title primary">prove</text>
  <text x="942" y="555" class="node-sub-strong selected-sub">results</text>

  <line x1="60" y1="637" x2="1140" y2="637" class="hairline"/>

  <text x="60" y="686" class="footer secondary">rybskiworks machine &#183; task in / proof out</text>
</svg>
