<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">rybskiworks / ganymede-agent</title>
  <desc id="desc">
    georgrybski machine identity. First moon that ships.
    Backdrop: Jupiter, trailing orbit arc, small moon west with transit shadow.
  </desc>

  <defs>
    <linearGradient id="whole-card-gradient" gradientUnits="userSpaceOnUse" x1="22" y1="22" x2="1178" y2="718">
      <stop offset="0%" class="grad-blue-edge"/>
      <stop offset="30%" class="grad-blue-edge"/>
      <stop offset="55%" class="grad-red-core"/>
      <stop offset="78%" class="grad-blue-edge"/>
      <stop offset="100%" class="grad-blue-edge"/>
    </linearGradient>
    <radialGradient id="planet-shade" cx="30%" cy="32%" r="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3b2312" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="band-wobble" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.09" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10" result="w"/>
      <feGaussianBlur in="w" stdDeviation="0.6"/>
    </filter>
    <filter id="blur8" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="blur1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
    <linearGradient id="terminator" x1="0.2" y1="0.1" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="52%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="limb-grade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="tac-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.0" class="tac-dot"/>
      <circle cx="18" cy="18" r="1.4" class="tac-dot-faint"/>
    </pattern>
    <clipPath id="inner-clip">
      <rect x="22" y="22" width="1156" height="696" rx="18"/>
    </clipPath>
    <linearGradient id="trail-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="trail-mask">
      <path d="M 816.1 190.9 L 811.3 191.6 L 806.6 192.2 L 801.9 192.9 L 797.2 193.6 L 792.6 194.3 L 788.1 194.9 L 783.6 195.6 L 779.2 196.3 L 774.8 196.9 L 770.5 197.6 L 766.2 198.3 L 762.0 198.9 L 757.9 199.6 L 753.8 200.3 L 749.8 200.9 L 745.9 201.6 L 742.0 202.2 L 738.2 202.9 L 734.5 203.5 L 730.8 204.2 L 727.2 204.8 L 723.7 205.4 L 720.2 206.1 L 716.8 206.7 L 713.5 207.3 L 710.3 207.9 L 707.2 208.6 L 704.1 209.2 L 701.1 209.8 L 698.2 210.4 L 695.4 211.0 L 692.7 211.6 L 690.0 212.2 L 687.4 212.7 L 684.9 213.3 L 682.5 213.9 L 680.2 214.4 L 678.0 215.0 L 675.8 215.5 L 673.8 216.1 L 671.8 216.6 L 669.9 217.1 L 668.1 217.7 L 666.4 218.2 L 664.8 218.7 L 663.3 219.2 L 661.9 219.7 L 660.5 220.1 L 659.3 220.6 L 658.1 221.1 L 657.1 221.5 L 656.1 222.0 L 655.3 222.4 L 654.5 222.8 L 653.8 223.3 L 653.2 223.7 L 652.7 224.1 L 652.3 224.5 L 652.0 224.8 L 651.8 225.2 L 651.7 225.6 L 651.7 225.9 L 651.8 226.3 L 652.0 226.6 L 652.3 226.9 L 652.6 227.2 L 653.1 227.5 L 653.7 227.8 L 654.3 228.1 L 655.1 228.4 L 655.9 228.6 L 656.8 228.9 L 657.9 229.1 L 659.0 229.3 L 660.2 229.6 L 661.5 229.8 L 662.9 230.0" fill="none" stroke="url(#trail-fade)" stroke-width="6" stroke-linecap="round"/>
    </mask>
    <clipPath id="jup-clip">
      <circle cx="965" cy="193" r="140"/>
    </clipPath>
  </defs>

  <style>
    .bg { fill: #ffffff; }
    .frame { fill: #f6f8fa; stroke: #c8d1db; stroke-width: 1.5; }
    .hairline { stroke: #c8d1db; stroke-width: 1.5; }
    .primary { fill: #1f2328; }
    .secondary { fill: #48515b; }
    .gradient-text { fill: url(#whole-card-gradient); }
    .grad-blue-edge { stop-color: #0891b2; }
    .grad-red-core { stop-color: #8250df; }
    .jup-base { fill: #f3e7d3; }
    .cap-top { fill: #e9d9b8; }
    .b2a { fill: #f8f0dd; }
    .b2b { fill: #e2a55f; }
    .b2c { fill: #f8f0dd; }
    .b3 { fill: #f4ead2; }
    .b4 { fill: #cf8a44; }
    .b5 { fill: #fbf6e8; }
    .b6 { fill: #bd7a38; }
    .b7 { fill: #f2e4c6; }
    .cap-bot { fill: #e9d9b8; }
    .fret { fill: none; stroke: #b98d4f; stroke-width: 1.4; opacity: 0.65; }
    .storm { fill: #fbf6e8; stroke: #b98d4f; stroke-width: 1.4; opacity: 0.9; }
    .spot { fill: #d95f3b; stroke: #a83e22; stroke-width: 2; }
    .spot-inner { fill: #f0936b; opacity: 0.85; }
    .orbit { fill: none; stroke: #c8d1db; stroke-width: 1.1; opacity: 0.55; }
    .orbit-ganymede { fill: none; stroke: #c8d1db; stroke-width: 1.4; opacity: 0.85; }
    .moon { fill: #9aa5b1; opacity: 0.9; }
    .moon-ganymede { fill: #0891b2; }
    .moon-halo { fill: none; stroke: #0891b2; stroke-width: 1.2; opacity: 0.7; }
    .star { fill: #c8d1db; opacity: 0.55; }
    .backdrop { opacity: 0.5; }
    .tac-dot { fill: #1f2328; opacity: 0.22; }
    .tac-dot-faint { fill: #1f2328; opacity: 0.12; }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .signature { font-size: 26px; font-weight: 700; letter-spacing: 1.2px; }
    .headline { font-size: 46px; font-weight: 700; letter-spacing: -1px; }
    .role { font-size: 24px; }
    .statement { font-size: 38px; font-weight: 600; letter-spacing: -0.45px; }
    .footer { font-size: 22px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .frame { fill: #161b22; stroke: #3a424c; }
      .hairline { stroke: #3a424c; }
      .primary { fill: #f0f6fc; }
      .secondary { fill: #a1abb5; }
      .grad-blue-edge { stop-color: #22d3ee; }
      .grad-red-core { stop-color: #d2a8ff; }
      .jup-base { fill: #2c2318; }
      .cap-top { fill: #4a3a26; }
      .b2a { fill: #5a4a33; }
      .b2b { fill: #6b4a26; }
      .b2c { fill: #54402c; }
      .b3 { fill: #5c4c34; }
      .b4 { fill: #6e4c28; }
      .b5 { fill: #65563c; }
      .b6 { fill: #604026; }
      .b7 { fill: #57462e; }
      .cap-bot { fill: #4a3a26; }
      .fret { stroke: #8a6a42; }
      .storm { fill: #65563c; stroke: #8a6a42; }
      .spot { fill: #8a5a4a; stroke: #a87a63; }
      .spot-inner { fill: #a87a63; opacity: 0.6; }
      .orbit { stroke: #3a424c; opacity: 0.7; }
      .orbit-ganymede { stroke: #3a424c; opacity: 0.95; }
      .moon { fill: #5b6570; }
      .moon-ganymede { fill: #22d3ee; }
      .moon-halo { stroke: #22d3ee; }
      .star { fill: #3a424c; opacity: 0.9; }
      .tac-dot { fill: #f0f6fc; opacity: 0.20; }
      .tac-dot-faint { fill: #f0f6fc; opacity: 0.10; }
    }
  </style>

  <rect width="1200" height="740" rx="24" class="bg"/>
  <rect x="22" y="22" width="1156" height="696" rx="18" class="frame"/>

  <g class="backdrop">
    <circle cx="120" cy="120" r="2.5" class="star"/>
    <circle cx="210" cy="300" r="1.8" class="star"/>
    <circle cx="340" cy="120" r="2" class="star"/>
    <circle cx="520" cy="90" r="1.6" class="star"/>
    <circle cx="700" cy="130" r="2.2" class="star"/>
    <circle cx="880" cy="90" r="1.7" class="star"/>
    <circle cx="150" cy="620" r="2" class="star"/>
    <circle cx="320" cy="680" r="1.6" class="star"/>
    <!-- trailing arc: moon moves west, trail fades behind (far side) -->
    <ellipse cx="965" cy="193" rx="315" ry="20" transform="rotate(-6 965 193)" fill="none" stroke="none"/>
    <g mask="url(#trail-mask)">
      <ellipse cx="965" cy="193" rx="315" ry="20" transform="rotate(-6 965 193)" class="orbit-ganymede"/>
    </g>
    <!-- Jupiter: banded body -->
    <circle cx="965" cy="193" r="140" class="jup-base" stroke="#6b7683" stroke-width="2"/>
    <g clip-path="url(#jup-clip)">
      <g filter="url(#band-wobble)">
      <rect x="825" y="53" width="280" height="30" class="cap-top"/>
      <rect x="825" y="83" width="280" height="12" class="b2a"/>
      <rect x="825" y="95" width="280" height="16" class="b2b"/>
      <rect x="825" y="111" width="280" height="14" class="b2c"/>
      <rect x="825" y="125" width="280" height="34" class="b3"/>
      <rect x="825" y="159" width="280" height="28" class="b4"/>
      <rect x="825" y="187" width="280" height="32" class="b5"/>
      <rect x="825" y="219" width="280" height="32" class="b6"/>
      <rect x="825" y="251" width="280" height="36" class="b7"/>
      <rect x="825" y="287" width="280" height="46" class="cap-bot"/>
      <!-- belt ripple -->
      <path d="M 825 165 Q 895 158 965 165 T 1105 163" fill="none" stroke="#c8d1db" stroke-width="1" opacity="0.5"/>
      <path d="M 825 227 Q 895 234 965 227 T 1105 229" fill="none" stroke="#c8d1db" stroke-width="1" opacity="0.5"/>
      <!-- fractal frets on orange bands -->
      <path d="M 840 172 q 18 -7 36 0 t 36 0 t 36 2 t 36 -3 t 36 1 t 36 -1 t 36 2" class="fret"/>
      <path d="M 845 180 q 22 6 44 0 t 44 -2 t 44 3 t 44 -3 t 44 1 t 44 0" class="fret"/>
      <path d="M 840 232 q 18 -6 36 1 t 36 -2 t 36 2 t 36 -2 t 36 1 t 36 -1 t 36 2" class="fret"/>
      <path d="M 845 240 q 22 5 44 -1 t 44 2 t 44 -3 t 44 2 t 44 0 t 40 -1" class="fret"/>
      <path d="M 850 103 q 20 -4 40 0 t 40 1 t 40 -2 t 40 1 t 40 0" class="fret"/>
      <path d="M 835 295 q 20 -5 40 0 t 40 1 t 40 -2 t 40 2 t 40 -1 t 40 1 t 36 0" class="fret"/>
      <path d="M 845 304 q 24 4 48 0 t 48 -2 t 48 2 t 48 -1 t 44 1" class="fret"/>
      <!-- small storms -->
      <ellipse cx="905" cy="173" rx="9" ry="5" class="storm"/>
      <ellipse cx="986" cy="234" rx="7" ry="4" class="storm"/>
      <ellipse cx="935" cy="241" rx="5" ry="3" class="storm"/>
      <ellipse cx="1062" cy="170" rx="6" ry="3.5" class="storm"/>
      </g>
      <!-- Great Red Spot: tight split flow, blurred, inner swirl -->
      <path d="M 935 243 Q 970 236 986 231 Q 1000 226 1012 227 Q 1025 228 1039 232 Q 1056 237 1092 240" fill="none" stroke="#b98d4f" stroke-width="1.8" opacity="0.9" filter="url(#blur2)"/>
      <path d="M 935 249 Q 970 256 986 261 Q 1000 266 1012 265 Q 1025 264 1039 260 Q 1056 255 1092 252" fill="none" stroke="#b98d4f" stroke-width="1.8" opacity="0.9" filter="url(#blur2)"/>
      <ellipse cx="1012" cy="246" rx="30" ry="17" class="spot"/>
      <ellipse cx="1012" cy="246" rx="17" ry="9" class="spot-inner"/>
      <!-- whirl-chain around the rim: small irregular enchained circles -->
      <g fill="none" stroke="#a83e22" stroke-width="1" opacity="0.7" filter="url(#blur2)">
        <circle cx="986" cy="236" r="3.2"/>
        <circle cx="990" cy="233" r="2.4"/>
        <circle cx="994" cy="236" r="2.8"/>
        <circle cx="998" cy="232" r="2.0"/>
        <circle cx="1002" cy="235" r="2.6"/>
        <circle cx="1006" cy="232" r="1.8"/>
        <circle cx="1010" cy="234" r="2.4"/>
        <circle cx="1014" cy="231" r="1.7"/>
        <circle cx="1018" cy="234" r="2.2"/>
        <circle cx="1022" cy="232" r="1.6"/>
        <circle cx="1026" cy="235" r="2.0"/>
        <circle cx="1030" cy="233" r="1.5"/>
        <circle cx="986" cy="256" r="3.0"/>
        <circle cx="990" cy="259" r="2.3"/>
        <circle cx="994" cy="256" r="2.7"/>
        <circle cx="998" cy="260" r="1.9"/>
        <circle cx="1002" cy="257" r="2.5"/>
        <circle cx="1006" cy="260" r="1.8"/>
        <circle cx="1010" cy="258" r="2.3"/>
        <circle cx="1014" cy="261" r="1.6"/>
        <circle cx="1018" cy="258" r="2.1"/>
        <circle cx="1022" cy="260" r="1.5"/>
        <circle cx="1026" cy="257" r="1.9"/>
        <circle cx="1030" cy="259" r="1.4"/>
      </g>
      <!-- ganymede transit shadow -->
      <ellipse cx="890" cy="228" rx="5.5" ry="5.5" fill="#160b03" opacity="0.95" filter="url(#blur1)"/>
      <!-- limb shading -->
      <circle cx="965" cy="193" r="140" fill="url(#planet-shade)"/>
      <circle cx="965" cy="193" r="140" fill="url(#terminator)"/>
      <!-- east-limb crescent: dark ellipse overlapping the limb, clipped to disk -->
      <path d="M 965 53 A 95 140 0 0 1 965 333 A 140 140 0 0 0 965 53 Z" fill="url(#limb-grade)" opacity="0.92" filter="url(#blur2)"/>
    </g>
    <circle cx="965" cy="193" r="140" fill="none" stroke="#4b5560" stroke-width="2"/>
    <!-- ganymede: small, highlighted, west elongation -->
    <circle cx="662.9" cy="230.0" r="8" class="moon-halo"/>
    <circle cx="662.9" cy="230.0" r="4.5" class="moon-ganymede"/>
  </g>

  <text x="60" y="86" class="signature gradient-text">rybskiworks</text>

  <text x="60" y="147" class="headline primary">ganymede-agent</text>
  <text x="60" y="207" class="role secondary">georgrybski&#8217;s machine identity</text>

  <text x="60" y="460" class="statement primary">first moon that ships.</text>

  <line x1="60" y1="637" x2="1140" y2="637" class="hairline"/>

  <text x="60" y="686" class="footer secondary">code of mass construction</text>

  <g clip-path="url(#inner-clip)"><rect x="22" y="22" width="1156" height="696" fill="url(#tac-dots)" opacity="0.45" pointer-events="none"/></g>
</svg>
